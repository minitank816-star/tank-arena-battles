<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Arena Battles</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }
        
        /* Main Menu */
        #main-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(20,25,30,0.95), rgba(5,10,15,0.98));
            z-index: 10;
        }
        .title-container {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 3.5rem;
            letter-spacing: 3px;
            color: #e67e22;
            text-shadow: 0 0 15px rgba(230, 126, 34, 0.5), 0 4px 6px #000;
            text-transform: uppercase;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #7f8c8d;
            letter-spacing: 2px;
            margin-top: 5px;
        }
        .btn {
            background: linear-gradient(180deg, #d35400, #a04000);
            color: #fff;
            border: 2px solid #e67e22;
            padding: 12px 36px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            margin-bottom: 25px;
        }
        .btn:hover {
            background: linear-gradient(180deg, #e67e22, #d35400);
            box-shadow: 0 0 15px rgba(230, 126, 34, 0.8);
            transform: translateY(-2px);
        }
        .level-grid-container {
            width: 80%;
            max-width: 700px;
            max-height: 40vh;
            background: rgba(0,0,0,0.5);
            border: 1px solid #333;
            border-radius: 6px;
            padding: 15px;
            overflow-y: auto;
        }
        .level-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
        }
        .level-btn {
            aspect-ratio: 1;
            background: #2c3e50;
            border: 1px solid #34495e;
            color: #ecf0f1;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .level-btn.unlocked:hover {
            background: #2980b9;
            border-color: #3498db;
        }
        .level-btn.locked {
            background: #1a252f;
            color: #7f8c8d;
            border-color: #111;
            cursor: not-allowed;
            opacity: 0.5;
        }
        .level-btn.active {
            background: #27ae60;
            border-color: #2ecc71;
        }

        /* HUD */
        #hud {
            display: none;
            justify-content: space-between;
            align-items: flex-start;
            padding: 15px;
        }
        .hud-card {
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 10px 15px;
            backdrop-filter: blur(4px);
        }
        .score-board {
            display: flex;
            gap: 30px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .score-team { color: #3498db; }
        .score-enemy { color: #e74c3c; }
        .cooldown-bar-bg {
            width: 150px;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        .cooldown-bar-fill {
            height: 100%;
            width: 100%;
            background: #e67e22;
        }
        
        /* Game Over / Victory Overlay */
        #end-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            z-index: 10;
        }
        #end-title {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="main-menu" class="ui-layer interactive">
            <div class="title-container">
                <h1>Tank Arena Battles</h1>
                <div class="subtitle">made by TankEditor V1.23.3</div>
            </div>
            <button id="play-btn" class="btn">Start Mission</button>
            <div class="level-grid-container">
                <div id="level-grid" class="level-grid"></div>
            </div>
        </div>

        <div id="hud" class="ui-layer">
            <div class="hud-card">
                <div class="score-board">
                    <span class="score-team">ALLIES: <span id="ally-score">0</span></span>
                    <span class="score-enemy">ENEMIES: <span id="enemy-score">0</span></span>
                </div>
                <div style="margin-top: 8px; font-size: 0.8rem; color: #aaa;">
                    LEVEL <span id="hud-level">1</span>
                </div>
            </div>
            <div class="hud-card" style="text-align: right;">
                <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 2px;">CANNON READY</div>
                <div class="cooldown-bar-bg">
                    <div id="cooldown-fill" class="cooldown-bar-fill"></div>
                </div>
            </div>
        </div>

        <div id="end-screen" class="ui-layer interactive">
            <h2 id="end-title">VICTORY</h2>
            <p id="end-sub" style="margin-bottom: 20px; color: #ccc;"></p>
            <button id="next-btn" class="btn">Next Level</button>
            <button id="menu-btn" class="btn" style="background: linear-gradient(180deg, #7f8c8d, #34495e); border-color: #95a5a6;">Main Menu</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
